<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Salon Dashboard — Kazan</title>
    <style>
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            position: relative;
        }

        /* Фоновая видеозона */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 1;
            background: #000;
        }

        .video-background iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Премиальная тонировка */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.85) 30%, rgba(10,10,10,0.4) 100%);
            z-index: 2;
        }

        /* Контентный слой */
        .interface-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 80px 100px;
        }

        .header-zone {
            display: flex;
            align-items: center;
        }

        .logo-container {
            max-width: 320px;
            height: auto;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .footer-widgets {
            display: flex;
            align-items: flex-end;
            gap: 120px;
        }

        .widget-clock {
            display: flex;
            flex-direction: column;
        }

        .time-display {
            font-family: 'Inter', sans-serif;
            font-weight: 200;
            font-size: 110px;
            line-height: 1;
            letter-spacing: -2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .date-display {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #8e8e93;
            margin-top: 15px;
        }

        .divider {
            width: 1px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-end;
            margin-bottom: 10px;
        }

        .widget-weather {
            display: flex;
            flex-direction: column;
            margin-bottom: 5px;
        }

        .weather-temp {
            font-family: 'Inter', sans-serif;
            font-weight: 200;
            font-size: 64px;
            line-height: 1;
            color: #ffffff;
        }

        .weather-temp span {
            font-size: 36px;
            vertical-align: super;
            font-weight: 300;
            color: #8e8e93;
        }

        .weather-status {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #8e8e93;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Фоновое видео из Rutube -->
    <div class="video-background">
        <!-- 
           ВНИМАНИЕ: Обязательно вставьте вместо слов ВАШ_ИД реальный ID видео.
           Параметры изменены для гарантированного обхода блокировок браузера ТВ.
        -->
        <iframe src="https://rutube.ru" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="video-overlay"></div>

    <div class="interface-layer">
        
        <div class="header-zone">
            <div class="logo-container">
                <img src="logo.png" alt="Company Logo">
            </div>
        </div>

        <div class="footer-widgets">
            
            <div class="widget-clock">
                <div class="time-display" id="clock-time">00:00</div>
                <div class="date-display" id="clock-date">Понедельник, 1 января</div>
            </div>

            <div class="divider"></div>

            <div class="widget-weather">
                <div class="weather-temp" id="weather-degree">+0<span>°C</span></div>
                <div class="weather-status" id="weather-desc">Казань</div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. Часы по Москве ---
        function updateDateTime() {
            const now = new Date();
            const timeOptions = { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit', hour12: false };
            document.getElementById('clock-time').innerText = new Intl.DateTimeFormat('ru-RU', timeOptions).format(now);

            const dateOptions = { timeZone: 'Europe/Moscow', weekday: 'long', day: 'numeric', month: 'long' };
            let dateString = new Intl.DateTimeFormat('ru-RU', dateOptions).format(now);
            dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
            document.getElementById('clock-date').innerText = dateString;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();


        // --- 2. Погода (Казань) через старый совместимый метод запросов ---
        const weatherCodes = {
            0: 'Ясно', 1: 'Преимущественно ясно', 2: 'Переменная облачность', 3: 'Пасмурно',
            45: 'Туман', 48: 'Иней с туманом', 51: 'Легкая морось', 53: 'Морось', 55: 'Плотная морось',
            61: 'Слабый дождь', 63: 'Умеренный дождь', 65: 'Сильный дождь', 71: 'Слабый снегопад',
            73: 'Снегопад', 75: 'Сильный снегопад', 77: 'Снежная крупа', 80: 'Слабый ливень',
            81: 'Ливень', 82: 'Сильный ливень', 95: 'Гроза'
        };

        function fetchWeather() {
            var xhr = new XMLHttpRequest();
            // Запрос идет по HTTP протоколу, совместимому со старыми ТВ
            xhr.open('GET', 'https://open-meteo.com', true);
            
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        var temp = Math.round(data.current_weather.temperature);
                        var code = data.current_weather.weathercode;
                        
                        var displayTemp = temp > 0 ? '+' + temp : temp;
                        document.getElementById('weather-degree').innerHTML = displayTemp + '<span>°C</span>';
                        document.getElementById('weather-desc').innerText = weatherCodes[code] || 'Казань';
                    } catch (e) {
                        document.getElementById('weather-desc').innerText = 'Казань';
                    }
                }
            };
            xhr.send();
        }

        setInterval(fetchWeather, 1800000);
        fetchWeather();


        // --- 3. Автоматическая перезагрузка страницы раз в 4 часа ---
        setTimeout(function() {
            window.location.reload();
        }, 4 * 60 * 60 * 1000);

    </script>
</body>
</html>
