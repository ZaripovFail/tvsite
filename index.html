<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Salon Dashboard — Kazan</title>
    <style>
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Премиальный глубокий графитовый градиент */
        body {
            background: radial-gradient(circle at 80% 20%, #1c1d21 0%, #0c0d0f 60%, #050507 100%);
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            position: relative;
        }

        /* Контентный слой */
        .interface-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 90px 110px;
        }

        .header-zone {
            display: flex;
            align-items: center;
        }

        .logo-container {
            max-width: 320px;
            height: auto;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .footer-widgets {
            display: flex;
            align-items: flex-end;
            gap: 120px;
        }

        .widget-clock {
            display: flex;
            flex-direction: column;
        }

        .time-display {
            font-family: 'Inter', sans-serif;
            font-weight: 200;
            font-size: 115px;
            line-height: 1;
            letter-spacing: -2px;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255,255,255,0.05);
        }

        .date-display {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #8e8e93;
            margin-top: 18px;
        }

        .divider {
            width: 1px;
            height: 95px;
            background: rgba(255, 255, 255, 0.08);
            align-self: flex-end;
            margin-bottom: 10px;
        }

        .widget-weather {
            display: flex;
            flex-direction: column;
            margin-bottom: 5px;
        }

        .weather-temp {
            font-family: 'Inter', sans-serif;
            font-weight: 200;
            font-size: 68px;
            line-height: 1;
            color: #ffffff;
        }

        .weather-temp span {
            font-size: 38px;
            vertical-align: super;
            font-weight: 300;
            color: #8e8e93;
        }

        .weather-status {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #8e8e93;
            margin-top: 22px;
        }
    </style>
</head>
<body>

    <div class="interface-layer">
        
        <!-- Логотип компании -->
        <div class="header-zone">
            <div class="logo-container">
                <img src="logo.png" alt="Company Logo" onerror="this.style.opacity='0.3';">
            </div>
        </div>

        <!-- Информационные виджеты -->
        <div class="footer-widgets">
            
            <!-- Часы и дата -->
            <div class="widget-clock">
                <div class="time-display" id="clock-time">00:00</div>
                <div class="date-display" id="clock-date">Понедельник, 1 января</div>
            </div>

            <div class="divider"></div>

            <!-- Погода (Казань) -->
            <div class="widget-weather">
                <div class="weather-temp" id="weather-degree">--<span>°C</span></div>
                <div class="weather-status" id="weather-desc">Обновление данных</div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. Работа часов и даты по Москве ---
        function updateDateTime() {
            var now = new Date();
            var timeOptions = { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit', hour12: false };
            document.getElementById('clock-time').innerText = new Intl.DateTimeFormat('ru-RU', timeOptions).format(now);

            var dateOptions = { timeZone: 'Europe/Moscow', weekday: 'long', day: 'numeric', month: 'long' };
            var dateString = new Intl.DateTimeFormat('ru-RU', dateOptions).format(now);
            dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
            document.getElementById('clock-date').innerText = dateString;
        }
        
        setInterval(updateDateTime, 1000);
        updateDateTime();


        // --- 2. Погода для Казани (Улучшенный и совместимый метод) ---
        var weatherCodes = {
            0: 'Ясно', 1: 'Преимущественно ясно', 2: 'Переменная облачность', 3: 'Пасмурно',
            45: 'Туман', 48: 'Иней с туманом', 51: 'Легкая морось', 53: 'Морось', 55: 'Плотная морось',
            61: 'Слабый дождь', 63: 'Умеренный дождь', 65: 'Сильный дождь', 71: 'Слабый снегопад',
            73: 'Снегопад', 75: 'Сильный снегопад', 77: 'Снежная крупа', 80: 'Слабый ливень',
            81: 'Ливень', 82: 'Сильный ливень', 95: 'Гроза'
        };

        function fetchWeather() {
            var xhr = new XMLHttpRequest();
            // Используем оптимизированный URL-запрос для жесткой совместимости с ТВ
            var url = 'https://open-meteo.com';
            
            xhr.open('GET', url, true);
            xhr.setRequestHeader('Accept', 'application/json');
            
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            if (data && data.current_weather) {
                                var temp = Math.round(data.current_weather.temperature);
                                var code = data.current_weather.weathercode;
                                
                                // Выводим знак плюс для положительной температуры
                                var displayTemp = temp > 0 ? '+' + temp : temp;
                                
                                document.getElementById('weather-degree').innerHTML = displayTemp + '<span>°C</span>';
                                document.getElementById('weather-desc').innerText = weatherCodes[code] || 'Казань';
                            } else {
                                document.getElementById('weather-desc').innerText = 'Казань';
                            }
                        } catch (e) {
                            document.getElementById('weather-desc').innerText = 'Казань';
                        }
                    } else {
                        // Ошибка сервера — убираем прочерки и пишем город
                        document.getElementById('weather-desc').innerText = 'Казань';
                    }
                }
            };
            xhr.send();
        }

        // Обновление погоды каждые 30 минут
        setInterval(fetchWeather, 1800000);
        fetchWeather();


        // --- 3. Автоматическая перезагрузка страницы раз в 12 часов ---
        setTimeout(function() {
            window.location.reload();
        }, 12 * 60 * 60 * 1000);

    </script>
</body>
</html>
